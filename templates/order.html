<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order - Cyber Mtaani</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.box{background:white;max-width:420px;width:100%;padding:25px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:left}
h2{margin:0 0 5px;color:#0f172a;text-align:center}
.sub{font-size:12px;color:#64748b;text-align:center;margin-bottom:15px}
label{font-size:12px;font-weight:700;margin-top:12px;display:block}
input,textarea{width:100%;padding:10px 12px;margin-top:5px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;box-sizing:border-box}
.btn{width:100%;background:#25D366;color:white;border:0;padding:12px;border-radius:8px;font-weight:800;margin-top:18px;cursor:pointer}
.back{display:block;text-align:center;margin-top:12px;font-size:12px;color:#64748b;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2>CYBER <span style="color:#facc15">MTAANI</span></h2>
<div class="sub" id="serviceLabel">Place your order</div>
<label>Service</label><input id="service" readonly style="background:#f8fafc;font-weight:700">
<label>Your Name</label><input id="name" placeholder="John Mwangi">
<label>Phone / WhatsApp</label><input id="phone" placeholder="07...">
<label>Details</label><textarea id="details" rows="3" placeholder="Explain what you need..."></textarea>
<button class="btn" onclick="sendWhatsApp()">SEND VIA WHATSAPP</button>
<a class="back" href="index.html">← Back to Home</a>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const svc = urlParams.get('service') || 'Other';
document.getElementById('service').value = svc;
document.getElementById('serviceLabel').innerText = 'You selected: ' + svc;
function sendWhatsApp(){
const name=document.getElementById('name').value;
const phone=document.getElementById('phone').value;
const details=document.getElementById('details').value;
if(!name||!phone){alert('Enter name and phone');return;}
const msg=`Hello Cyber Mtaani%0ASERVICE: ${svc}%0AName: ${name}%0APhone: ${phone}%0ADetails: ${details}`;
window.open('https://wa.me/254706507594?text='+msg,'_blank');
}
</script>
</body>
</html>
